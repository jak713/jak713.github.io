<script>
    document.querySelectorAll('.blog-index a').forEach(link => {
        link.addEventListener('click', async function(e) {
            e.preventDefault();
            const postId = this.getAttribute('href').substring(1);
            
            try {
                const response = await fetch(`posts/${postId}.md`);
                const markdown = await response.text();
                const html = marked.parse(markdown);
                
                // Add back button before the content
                document.getElementById('content').innerHTML = 
                    document.getElementById('content').innerHTML = 
                    '<button  class="blogButton" onclick="showIndex()">← Back to Posts</button>' + html;

                // Add syntax highlighting
                document.querySelectorAll('#content pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                
                document.getElementById('content').style.display = 'block';
                document.querySelector('.blog-container').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading post:', error);
                alert('Could not load blog post');
            }
        });
    });
    
    // Function to go back to the index
    function showIndex() {
        document.querySelector('.blog-container').style.display = 'block';
        document.getElementById('content').style.display = 'none';
    }
</script>
